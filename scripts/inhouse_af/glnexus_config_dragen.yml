# GLnexus joint-genotyping config for DRAGEN gVCFs.
#
# Same unifier as the built-in `gatk` preset (allele discovery / quality
# thresholds behave identically — that step already succeeds on our data),
# but with genotyper_config.revise_genotypes = false.
#
# WHY: the `gatk` preset sets revise_genotypes: true, which re-derives every
# genotype from the per-record PL (genotype likelihoods). DRAGEN gVCF records
# don't always carry PL (reference blocks in particular), so GLnexus aborts
# genotyping with:
#   genotyper::revise_genotypes: couldn't find genotype likelihoods (NotFound)
# Disabling revision makes GLnexus translate DRAGEN's own GT calls into the
# unified allele numbering instead of recomputing them — the appropriate mode
# for a non-GATK caller (the DeepVariant presets also use revise_genotypes:false).
#
# We emit GT only (no liftover FORMAT fields) on purpose: the downstream
# pipeline strips genotypes and derives INHOUSE_AC/AN/AF/NHOM from GT via
# bcftools +fill-tags, so DP/AD/PL are not needed in the AF sites VCF.
unifier_config:
  drop_filtered: false
  min_allele_copy_number: 1
  min_AQ1: 70
  min_AQ2: 40
  min_GQ: 40
  max_alleles_per_site: 32
  monoallelic_sites_for_lost_alleles: true
  preference: common
genotyper_config:
  revise_genotypes: false
  min_assumed_allele_frequency: 9.99999975e-05
  required_dp: 1
  allow_partial_data: false
  allele_dp_format: AD
  ref_dp_format: MIN_DP
  output_format: BCF
