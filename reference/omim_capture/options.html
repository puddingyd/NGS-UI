<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>NGS OMIM Capture 設定</title>
  <style>
    body { font: 14px/1.6 -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; color: #1f2328;
      background: #f6f8fa; margin: 0; padding: 32px 16px; }
    main { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #d0d7de;
      border-radius: 8px; padding: 24px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.lead { color: #59636e; margin: 0 0 20px; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #d0d7de;
      border-radius: 6px; font: inherit; }
    .hint { color: #59636e; font-size: 12px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; margin-top: 20px; }
    button { border: 1px solid #1f6feb; background: #1f6feb; color: #fff; border-radius: 6px;
      padding: 7px 14px; font: inherit; cursor: pointer; }
    button.secondary { background: #f6f8fa; color: #1f2328; border-color: #d0d7de; }
    #result { margin-top: 16px; padding: 8px 10px; border-radius: 6px; display: none; }
    #result.ok { display: block; background: #dafbe1; color: #116329; }
    #result.err { display: block; background: #ffebe9; color: #a40e26; }
  </style>
</head>
<body>
<main>
  <h1>NGS OMIM Capture 設定</h1>
  <p class="lead">在 omim.org 的 entry 頁面右下角按「Capture 送到平台」，就會把目前頁面的內容送回 NGS 分析平台比對與保存。</p>

  <label for="platformUrl">平台網址</label>
  <input id="platformUrl" type="url" placeholder="http://192.168.84.91:8765">
  <div class="hint">預設為院內平台。改成其他網址時，Chrome 會詢問是否允許連線到該網址。</div>

  <label for="token">Capture token</label>
  <input id="token" type="password" autocomplete="off" placeholder="ngsc_…">
  <div class="hint">登入平台後開啟「/omim-capture/」頁面產生 token，貼到這裡。token 只存在這台電腦的瀏覽器裡。</div>

  <div class="actions">
    <button id="save">儲存並測試連線</button>
    <button id="open" class="secondary">開啟平台擷取頁</button>
  </div>
  <div id="result"></div>
</main>
<script src="options.js"></script>
</body>
</html>
